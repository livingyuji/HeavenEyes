# ============================================================
#               HEAVEN EYES — ANTI-CHEAT CONFIGURATION
#                     Author: LivingYuji
# ============================================================

settings:
  # Enable detailed debug messages in console for check tuning
  debug: false
  # Global switch for real-time staff alerts
  alerts-enabled: true
  # Cooldown between alerts for the same player and check (e.g. 3s, 5s)
  alert-cooldown: "3s"
  # Whether non-staff players can run /he status to see safe status
  public-status: true
  # Server tick interval for background tasks (e.g. violation decay)
  tick-interval: 20
  # Rate-limiting window for repeated detection aggregation
  repeated-detection-window: "60s"
  # Default retention days for data cleanup
  retention-days: 30
  # Allow automatic backup creation on /he backup
  backups:
    enabled: true
    max-backups: 10
  # Incident evidence storage
  evidence:
    auto-save-on-warning: true
    auto-save-on-punishment: true
    max-in-memory-incidents: 500

# Exemptions: players or groups exempt from anti-cheat checks
exemptions:
  # Player UUIDs or names explicitly exempt
  players: []
  # Automatically exempt creative and spectator gamemodes
  exempt-creative: true
  exempt-spectator: true

# Audit logging
audit:
  enabled: true
  file: "audit/audit.log"
  log-console-actions: true

# ============================================================
# DISCORD INTEGRATION SETTINGS
# ============================================================
discord:
  # Master toggle for Discord Webhook integration
  enabled: false

  # Server name displayed in embed footers and headers
  server-name: "Heaven Eyes Survival"

  # Webhook URLs for dedicated channels (keep private; never commit secrets)
  webhook-urls:
    # Channel for real-time suspicious violation alerts
    alerts: ""
    # Channel for punishments (warnings, kicks, temporary/permanent bans, unbans)
    punishments: ""
    # Channel for player history audit records
    history: ""
    # Channel for system lifecycle logs (startup, shutdown, critical errors)
    system-logs: ""

  # Live violation alert settings
  alerts:
    enabled: true
    # Minimum violation level (VL) required to send a Discord embed
    minimum-violation-level: 3
    # Cooldown in seconds between alerts for the same player and check
    cooldown-seconds: 10
    # Group repeated detections within cooldown to avoid Discord spam
    batch-repeated-alerts: true

  # Punishment logging settings
  punishments:
    enabled: true
    log-warnings: true
    log-kicks: true
    log-temporary-bans: true
    log-permanent-bans: true
    log-unbans: true

  # Supplementary player history audit events
  player-history:
    enabled: true

  # System status and critical plugin error logs
  system-logs:
    enabled: true

  # Asynchronous delivery and backoff retry configuration
  delivery:
    asynchronous: true
    retry-enabled: true
    max-retries: 5
    queue-capacity: 1000
